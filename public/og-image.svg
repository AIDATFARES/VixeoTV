<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="ogBgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="60%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#080B11" />
    </radialGradient>
    <linearGradient id="ogBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#00B8DE" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="ogTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBgGlow)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="600" cy="220" r="280" fill="#00D4FF" opacity="0.12" filter="url(#ogGlow)" />
  <circle cx="750" cy="280" r="220" fill="#7928CA" opacity="0.12" filter="url(#ogGlow)" />

  <!-- Logo Mark in Center -->
  <g transform="translate(530, 90) scale(1.4)">
    <rect x="6" y="8" width="88" height="80" rx="20" fill="#0E131F" stroke="url(#ogBrandGrad)" stroke-width="3.5" />
    <circle cx="82" cy="18" r="4" fill="#00D4FF" />
    <path d="M25 28 L45 70 C47 74 53 74 55 70 L75 28 L63 28 L50 56 L37 28 Z" fill="url(#ogBrandGrad)" />
    <polygon points="46,41 59,48.5 46,56" fill="#FFFFFF" />
  </g>

  <!-- Brand Title -->
  <text x="600" y="300" font-family="'Outfit', 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    VIXEO<tspan fill="#00D4FF">TV</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="360" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="url(#ogTextGrad)" text-anchor="middle">
    Next-Gen Ultra HD IPTV Streaming Experience
  </text>

  <!-- Key Pills -->
  <g transform="translate(230, 420)">
    <rect x="0" y="0" width="220" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(0,212,255,0.3)" />
    <text x="110" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#00D4FF" text-anchor="middle">⚡ 4K &amp; 60FPS Streams</text>

    <rect x="250" y="0" width="230" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(0,212,255,0.3)" />
    <text x="365" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#00D4FF" text-anchor="middle">🛡️ Anti-Freeze v2.0</text>

    <rect x="510" y="0" width="230" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(0,212,255,0.3)" />
    <text x="625" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#00D4FF" text-anchor="middle">📱 Universal Devices</text>
  </g>

  <!-- Domain and WhatsApp Footer -->
  <text x="600" y="550" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">
    www.vixeotv.net • 24/7 Dedicated Support &amp; Instant Setup
  </text>
</svg>
