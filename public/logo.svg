<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="vixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#00B8DE" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="tvBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Mark Icon -->
  <g transform="translate(4, 8) scale(0.68)">
    <rect x="6" y="8" width="88" height="80" rx="20" fill="#0E131F" stroke="url(#vixGrad)" stroke-width="3.5" />
    <circle cx="82" cy="18" r="4" fill="#00D4FF" />
    <path d="M25 28 L45 70 C47 74 53 74 55 70 L75 28 L63 28 L50 56 L37 28 Z" fill="url(#vixGrad)" />
    <polygon points="46,41 59,48.5 46,56" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="82" y="52" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
    VIXEO
  </text>
  
  <!-- TV Badge -->
  <rect x="216" y="24" width="56" height="34" rx="8" fill="url(#tvBadgeGrad)" />
  <text x="244" y="48" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1" fill="#080B11" text-anchor="middle">
    TV
  </text>
  
  <!-- Subtitle Tag -->
  <text x="84" y="69" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="3.2" fill="#94A3B8">
