<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vixeoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#0090B0" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Rounded Polygon / Screen Frame -->
  <rect x="8" y="12" width="84" height="76" rx="20" fill="#0E131F" stroke="url(#vixeoGrad)" stroke-width="3.5" />
  <!-- Corner Accent Node -->
  <circle cx="82" cy="22" r="3.5" fill="#00D4FF" filter="url(#cyanGlow)" />
  <!-- Stylized "V" Wave & Play Triangle -->
  <path d="M26 30 L45 68 C47 72 53 72 55 68 L74 30 L62 30 L50 56 L38 30 Z" fill="url(#vixeoGrad)" />
  <!-- Stream Action Play Arrow -->
  <polygon points="46,42 58,49 46,56" fill="url(#playGrad)" />
</svg>
